<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">BunnyBook 社交分享图</title>
  <desc id="desc">深色课程知识图谱与打开的书共同组成兔耳轮廓，文字为 BunnyBook，让备课 Agent 不再凭空编课。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b16"/>
      <stop offset="0.58" stop-color="#0b1325"/>
      <stop offset="1" stop-color="#12102a"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#79a9ff"/>
      <stop offset="0.5" stop-color="#c79cff"/>
      <stop offset="1" stop-color="#5de2a5"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop offset="0" stop-color="#79a9ff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#79a9ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
  </defs>

  <rect width="1200" height="630" rx="32" fill="url(#bg)"/>
  <circle cx="905" cy="310" r="270" fill="url(#halo)"/>
  <circle cx="1110" cy="64" r="120" fill="#c79cff" opacity="0.06" filter="url(#soft)"/>
  <path d="M0 520 C250 470 440 584 710 532 C918 491 1070 500 1200 454 V630 H0Z" fill="#79a9ff" opacity="0.035"/>

  <g opacity="0.28" stroke="#7894c9" stroke-width="1.4">
    <path d="M66 110 L206 74 L309 133 L423 75"/>
    <path d="M76 526 L210 474 L333 541 L470 487"/>
    <path d="M468 96 L526 144 L580 102"/>
  </g>
  <g fill="#79a9ff" opacity="0.7">
    <circle cx="66" cy="110" r="4"/><circle cx="206" cy="74" r="5"/><circle cx="309" cy="133" r="4"/><circle cx="423" cy="75" r="3"/>
    <circle cx="76" cy="526" r="4"/><circle cx="210" cy="474" r="3"/><circle cx="333" cy="541" r="5"/><circle cx="470" cy="487" r="4"/>
  </g>

  <g transform="translate(690 74)">
    <ellipse cx="215" cy="232" rx="242" ry="238" fill="#0c1428" stroke="#263552" stroke-width="2"/>

    <g fill="none" stroke-linecap="round">
      <path d="M130 198 C85 130 93 43 137 32 C174 48 177 126 156 190" stroke="#79a9ff" stroke-width="18" opacity="0.86"/>
      <path d="M270 190 C251 113 259 36 302 26 C345 51 332 136 294 205" stroke="#c79cff" stroke-width="18" opacity="0.86"/>
      <path d="M138 188 C112 126 116 66 138 55" stroke="#dfe9ff" stroke-width="4" opacity="0.72"/>
      <path d="M289 187 C278 121 284 69 302 50" stroke="#f1e8ff" stroke-width="4" opacity="0.72"/>
    </g>

    <g stroke="#586d96" stroke-width="2" opacity="0.82">
      <path d="M65 272 L127 238 L191 270 L248 226 L350 262"/>
      <path d="M78 318 L143 282 L201 324 L264 282 L342 322"/>
      <path d="M127 238 L143 282 M191 270 L201 324 M248 226 L264 282"/>
      <path d="M143 282 L206 214 L264 282"/>
      <path d="M206 214 L246 166"/>
    </g>
    <g filter="url(#glow)">
      <circle cx="65" cy="272" r="7" fill="#5de2a5"/>
      <circle cx="127" cy="238" r="8" fill="#79a9ff"/>
      <rect x="135" y="274" width="16" height="16" rx="3" fill="#c79cff"/>
      <circle cx="191" cy="270" r="7" fill="#ff8fb3"/>
      <path d="M206 204 l10 17 h-20z" fill="#5cc8ff"/>
      <circle cx="248" cy="226" r="9" fill="#ffbc6e"/>
      <rect x="256" y="274" width="16" height="16" rx="3" fill="#79a9ff" transform="rotate(45 264 282)"/>
      <circle cx="350" cy="262" r="7" fill="#5de2a5"/>
      <circle cx="78" cy="318" r="6" fill="#c79cff"/>
      <circle cx="201" cy="324" r="8" fill="#79a9ff"/>
      <circle cx="342" cy="322" r="7" fill="#ff8fb3"/>
      <circle cx="246" cy="166" r="6" fill="#c79cff"/>
    </g>

    <g fill="none" stroke-linejoin="round">
      <path d="M74 364 C127 345 170 351 211 386 C252 351 296 345 350 364 L350 420 C296 401 253 409 211 442 C169 409 126 401 74 420Z" fill="#101d34" stroke="#79a9ff" stroke-width="3"/>
      <path d="M211 386 V442" stroke="#c79cff" stroke-width="3"/>
      <path d="M91 379 C134 367 166 373 198 397 M333 379 C290 367 258 373 225 397" stroke="#526b98" stroke-width="2" opacity="0.85"/>
    </g>
  </g>

  <g transform="translate(78 188)">
    <text x="0" y="0" fill="#aebbd4" font-family="Arial,PingFang SC,sans-serif" font-size="23" font-weight="600" letter-spacing="4">CURRICULUM SOURCE FOR AGENTS</text>
    <text x="0" y="98" fill="url(#brand)" font-family="Arial,sans-serif" font-size="92" font-weight="760" letter-spacing="-3">BunnyBook</text>
    <text x="0" y="170" fill="#f4f7ff" font-family="Arial,PingFang SC,sans-serif" font-size="38" font-weight="650">让备课 Agent 不再凭空编课</text>
    <text x="0" y="228" fill="#9faec8" font-family="Arial,PingFang SC,sans-serif" font-size="21">课标依据 · 跨学科主题 · 可追溯关系</text>
    <g transform="translate(0 266)">
      <rect width="310" height="46" rx="23" fill="#121d33" stroke="#344a70"/>
      <circle cx="25" cy="23" r="6" fill="#5de2a5"/>
      <text x="43" y="30" fill="#d8e1f2" font-family="Arial,PingFang SC,sans-serif" font-size="17">8 个主题 · 87 个节点 · 189 条关系</text>
    </g>
  </g>

  <rect x="1" y="1" width="1198" height="628" rx="31" fill="none" stroke="#26324b" stroke-width="2"/>
</svg>
