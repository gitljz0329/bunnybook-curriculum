name: Netlify live smoke test

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: read

jobs:
  smoke:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/netlify-live-smoke-test'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE_URL: https://bunnybook-curriculum.netlify.app

    steps:
      - name: Diagnose human exploration route
        shell: bash
        run: |
          set +e
          curl -sS -L --max-redirs 10 \
            -H 'Cache-Control: no-cache' \
            -D /tmp/explore.headers \
            -w 'curl_http=%{http_code}\ncurl_final_url=%{url_effective}\ncurl_redirects=%{num_redirects}\n' \
            "${BASE_URL}/explore/?role=teacher&smoke=${GITHUB_RUN_ID}" \
            -o /tmp/explore.html
          CURL_EXIT=$?
          set -e
          echo "curl_exit=${CURL_EXIT}"
          echo '--- response status/location chain ---'
          grep -Ei '^(HTTP/|location:|content-type:|content-security-policy:)' /tmp/explore.headers || true
          echo '--- response markers ---'
          python3 - <<'PY'
          from pathlib import Path
          path = Path('/tmp/explore.html')
          text = path.read_text(encoding='utf-8', errors='replace') if path.exists() else ''
          print(f'bytes={len(text.encode("utf-8"))}')
          for marker in ('id="learning-map"', '探索教学图谱', 'CURRICULUM SOURCE', '老师看得懂'):
              print(f'{marker}={marker in text}')
          print('prefix=' + repr(text[:180]))
          PY
          if [[ "$CURL_EXIT" -ne 0 ]]; then
            exit "$CURL_EXIT"
          fi

      - name: Verify human exploration route
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'id="learning-map"' /tmp/explore.html
          grep -F '探索教学图谱' /tmp/explore.html
          grep -F 'CURRICULUM SOURCE' /tmp/explore.html
          grep -Fi 'content-security-policy:' /tmp/explore.headers
